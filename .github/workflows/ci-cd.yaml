name: Continuous Integration & Container Delivery (CI/CD)

# El pipeline se activará automáticamente cada vez que se haga un push a la rama main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código fuente del repositorio en el servidor temporal de GitHub
    - name: Checkout Infrastructure Code
      uses: actions/checkout@v4

    # 2. Autenticarse de forma segura en Docker Hub usando tus Secrets encajonados
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets::DOCKERHUB_USERNAME }}
        password: ${{ secrets::DOCKERHUB_TOKEN }}

    # 3. Configurar herramientas de compilación avanzadas (Buildx)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Construir la imagen usando tu Dockerfile Multi-Stage y subirla (Push) a la nub
    - name: Build and Push Multi-Stage Production Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Reemplaza 'tu-usuario-docker' por tu nombre de usuario real de Docker Hub
        tags: |
          ${{ secrets::DOCKERHUB_USERNAME }}/mlops-fraud-api:latest
          ${{ secrets::DOCKERHUB_USERNAME }}/mlops-fraud-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max